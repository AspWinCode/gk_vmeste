server {
    listen 80;
    server_name _;

    client_max_body_size 220m; # чуть больше MAX_UPLOAD_MB бэкенда — под аудиофайлы транскрибатора

    # Статический фронтенд
    root /usr/share/nginx/html;
    index login.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Бэкенд — тот же origin, поэтому frontend/config.js использует относительный /api
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # загрузка/анализ аудио может идти дольше стандартных 60с
    }
}
