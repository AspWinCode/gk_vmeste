server {
    listen 80;
    server_name _;

    client_max_body_size 220m; # чуть больше MAX_UPLOAD_MB бэкенда — под аудиофайлы транскрибатора

    # Статический фронтенд
    root /usr/share/nginx/html;
    index login.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Бэкенд — тот же origin, поэтому frontend/config.js использует относительный /api.
    # proxy_pass со статическим хостом резолвится ОДИН РАЗ при старте nginx и кэшируется
    # навсегда — при пересборке api-контейнера (новый IP в docker-сети) nginx продолжит
    # стучаться по старому адресу. Фикс: resolver + переменная в proxy_pass — тогда nginx
    # переспрашивает докеровский DNS (127.0.0.11) на каждый запрос вместо кэша навечно.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:4000;

    location /api/ {
        proxy_pass http://$api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # загрузка/анализ аудио может идти дольше стандартных 60с
    }
}
